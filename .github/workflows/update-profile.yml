name: Update Profile Constellation

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate constellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          python <<'PY'

          import json
          import urllib.request
          import re
          import html

          USERNAME = "krishnapp2004"

          API_URL = (
              f"https://api.github.com/users/{USERNAME}/repos"
              "?per_page=100"
              "&sort=updated"
              "&direction=desc"
          )

          request = urllib.request.Request(
              API_URL,
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              repositories = json.load(response)

          ignored = {
              USERNAME
          }

          projects = []

          for repo in repositories:

              # Ignore the profile repository.
              if repo["name"] in ignored:
                  continue

              # Ignore forks.
              if repo["fork"]:
                  continue

              name = html.escape(repo["name"])
              description = html.escape(
                  repo["description"]
                  or "A project built and maintained on GitHub."
              )

              url = repo["html_url"]

              language = repo["language"]

              if language:
                  language = html.escape(language)
                  technology = f"`{language}`"
              else:
                  technology = "`GitHub`"

              projects.append({
                  "name": name,
                  "description": description,
                  "url": url,
                  "technology": technology
              })

          # Show only a small number so the profile remains curated.
          projects = projects[:6]

          if projects:

              cards = []

              for i in range(0, len(projects), 2):

                  first = projects[i]

                  first_card = f"""
          <td width="50%" valign="top">

          ### {first["name"]}

          {first["description"]}

          {first["technology"]} · <a href="{first["url"]}">Repository</a>

          </td>
          """

                  if i + 1 < len(projects):

                      second = projects[i + 1]

                      second_card = f"""
          <td width="50%" valign="top">

          ### {second["name"]}

          {second["description"]}

          {second["technology"]} · <a href="{second["url"]}">Repository</a>

          </td>
          """

                  else:

                      second_card = """
          <td width="50%" valign="top">

          </td>
          """

                  cards.append(
                      f"""
          <tr>
          {first_card}
          {second_card}
          </tr>
          """
                  )

              project_section = f"""
          <table>
          {"".join(cards)}
          </table>
          """

          else:

              project_section = """
          <div align="center">

          <i>The constellation is still forming.</i>

          </div>
          """

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          pattern = (
              r"<!-- PROJECTS:START -->"
              r".*?"
              r"<!-- PROJECTS:END -->"
          )

          replacement = (
              "<!-- PROJECTS:START -->\n\n"
              + project_section
              + "\n<!-- PROJECTS:END -->"
          )

          updated_readme = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(updated_readme)

          PY

      - name: Commit profile changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then

              echo "No changes detected."

          else

              git commit -m "chore: update profile constellation"

              git push

          fi
